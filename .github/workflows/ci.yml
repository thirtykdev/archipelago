name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:boundaries
      - run: npm run check:fixtures
      - run: npm test
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Tests with the network turned off (container with no network)
        # Unprivileged user namespaces are restricted on the hosted runner, so the suite runs in a
        # container that has no network interface but loopback. Any socket attempt fails the job.
        run: docker run --rm --network none -v "$PWD:/w" -w /w node:22 npm test
